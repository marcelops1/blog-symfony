nelmio_api_doc:
    documentation:
        info:
            title: Blog API
            description: |
                RESTful API for managing blog posts and authors.
                Built with Symfony 8 following Clean Architecture.
            version: 1.0.0
        components:
            schemas:
                ErrorResponse:
                    type: object
                    required:
                        - error
                    properties:
                        error:
                            type: string
                            example: 'Resource not found.'

    areas:
        default:
            path_patterns:
                - ^/api(?!/doc)

    use_validation_groups: false
